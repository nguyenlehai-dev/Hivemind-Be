[project]
name = "hivemind-be"
version = "0.1.0"
description = "FastAPI backend scaffold for Runway custom workflow integration"
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "playwright>=1.48.0",
  "pydantic-settings>=2.5.2",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
