<svg width="1470" height="920" viewBox="0 0 1470 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1470" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F8F8"/>
      <stop offset="1" stop-color="#E9F0EF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1FA89A"/>
      <stop offset="1" stop-color="#167F74"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="500" height="920" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#24403D" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow" x="-20" y="-20" width="390" height="240" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#112422" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1470" height="920" fill="url(#bg)"/>

  <text x="90" y="70" fill="#13312D" font-family="Sora, Arial, sans-serif" font-size="28" font-weight="700">Mobile Auth Flow</text>
  <text x="90" y="100" fill="#56706C" font-family="Inter, Arial, sans-serif" font-size="16">Basic login / logout screens with admin account, Google, and Apple sign-in options.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="140" width="390" height="760" rx="40" fill="#0E1F1D"/>
    <rect x="105" y="155" width="360" height="730" rx="32" fill="#F8FBFB"/>
    <rect x="236" y="173" width="98" height="10" rx="5" fill="#D1DCDA"/>

    <text x="137" y="235" fill="#1A3A36" font-family="Sora, Arial, sans-serif" font-size="30" font-weight="700">HiveMind</text>
    <text x="137" y="264" fill="#5A716D" font-family="Inter, Arial, sans-serif" font-size="15">Sign in to your workspace</text>

    <rect x="137" y="293" width="296" height="86" rx="24" fill="url(#accent)"/>
    <text x="161" y="326" fill="#D7FFFA" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">ADMIN ACCOUNT</text>
    <text x="161" y="352" fill="#FFFFFF" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700">Use the account created by Admin</text>

    <text x="137" y="419" fill="#3E5652" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Work Email</text>
    <rect x="137" y="430" width="296" height="56" rx="18" fill="#FFFFFF" stroke="#D6E2E0"/>
    <text x="159" y="464" fill="#8BA09C" font-family="Inter, Arial, sans-serif" font-size="15">name@company.com</text>

    <text x="137" y="519" fill="#3E5652" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Password</text>
    <rect x="137" y="530" width="296" height="56" rx="18" fill="#FFFFFF" stroke="#D6E2E0"/>
    <text x="159" y="564" fill="#8BA09C" font-family="Inter, Arial, sans-serif" font-size="15">..............</text>

    <text x="336" y="615" fill="#1A8E82" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Forgot password?</text>
    <rect x="137" y="635" width="296" height="56" rx="20" fill="#173633"/>
    <text x="248" y="669" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Log In</text>

    <line x1="137" y1="726" x2="250" y2="726" stroke="#D6E2E0"/>
    <line x1="320" y1="726" x2="433" y2="726" stroke="#D6E2E0"/>
    <text x="262" y="731" fill="#6E8480" font-family="Inter, Arial, sans-serif" font-size="13">or</text>

    <rect x="137" y="751" width="296" height="52" rx="18" fill="#FFFFFF" stroke="#D6E2E0"/>
    <circle cx="168" cy="777" r="14" fill="#EEF6F5"/>
    <text x="162" y="782" fill="#2E78F6" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">G</text>
    <text x="191" y="782" fill="#243835" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Continue with Google</text>

    <rect x="137" y="815" width="296" height="52" rx="18" fill="#FFFFFF" stroke="#D6E2E0"/>
    <circle cx="168" cy="841" r="14" fill="#EEF6F5"/>
    <text x="162" y="846" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">A</text>
    <text x="197" y="846" fill="#243835" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Continue with Apple</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="540" y="140" width="390" height="760" rx="40" fill="#0E1F1D"/>
    <rect x="555" y="155" width="360" height="730" rx="32" fill="#F8FBFB"/>
    <rect x="686" y="173" width="98" height="10" rx="5" fill="#D1DCDA"/>

    <text x="587" y="228" fill="#1A3A36" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700">Account</text>
    <text x="820" y="228" fill="#1A8E82" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Edit</text>

    <g filter="url(#cardShadow)">
      <rect x="587" y="255" width="296" height="148" rx="28" fill="#FFFFFF"/>
    </g>
    <circle cx="640" cy="329" r="34" fill="#DDF4F1"/>
    <text x="625" y="337" fill="#167F74" font-family="Sora, Arial, sans-serif" font-size="24" font-weight="700">AL</text>
    <text x="690" y="315" fill="#173633" font-family="Sora, Arial, sans-serif" font-size="22" font-weight="700">Alex Lee</text>
    <text x="690" y="341" fill="#5A716D" font-family="Inter, Arial, sans-serif" font-size="14">alex.lee@hivemind.app</text>
    <rect x="690" y="354" width="92" height="28" rx="14" fill="#E8F7F4"/>
    <text x="710" y="372" fill="#167F74" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Signed in</text>

    <text x="587" y="449" fill="#3E5652" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Sign-in Method</text>
    <rect x="587" y="461" width="296" height="84" rx="24" fill="#FFFFFF" stroke="#D6E2E0"/>
    <text x="611" y="494" fill="#173633" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Workspace account</text>
    <text x="611" y="519" fill="#6E8480" font-family="Inter, Arial, sans-serif" font-size="14">Account created and managed by Admin</text>

    <text x="587" y="585" fill="#3E5652" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Connected Options</text>
    <rect x="587" y="597" width="296" height="64" rx="22" fill="#FFFFFF" stroke="#D6E2E0"/>
    <circle cx="618" cy="629" r="14" fill="#EEF6F5"/>
    <text x="612" y="634" fill="#2E78F6" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">G</text>
    <text x="639" y="634" fill="#243835" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Google available</text>

    <rect x="587" y="677" width="296" height="64" rx="22" fill="#FFFFFF" stroke="#D6E2E0"/>
    <circle cx="618" cy="709" r="14" fill="#EEF6F5"/>
    <text x="612" y="714" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">A</text>
    <text x="645" y="714" fill="#243835" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Apple available</text>

    <rect x="587" y="781" width="296" height="56" rx="20" fill="#FDEFEF" stroke="#F4C7C7"/>
    <text x="708" y="815" fill="#C04747" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Log Out</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="990" y="140" width="390" height="760" rx="40" fill="#0E1F1D"/>
    <rect x="1005" y="155" width="360" height="730" rx="32" fill="#F8FBFB"/>
    <rect x="1136" y="173" width="98" height="10" rx="5" fill="#D1DCDA"/>

    <rect x="1005" y="155" width="360" height="730" rx="32" fill="#0A1413" fill-opacity="0.2"/>
    <g filter="url(#cardShadow)">
      <rect x="1037" y="553" width="296" height="248" rx="30" fill="#FFFFFF"/>
    </g>

    <circle cx="1185" cy="611" r="28" fill="#FDEFEF"/>
    <path d="M1185 596V613" stroke="#C04747" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1185" cy="633" r="3.5" fill="#C04747"/>

    <text x="1094" y="668" fill="#173633" font-family="Sora, Arial, sans-serif" font-size="24" font-weight="700">Log out now?</text>
    <text x="1070" y="699" fill="#5A716D" font-family="Inter, Arial, sans-serif" font-size="14">You will need to sign in again with your</text>
    <text x="1079" y="721" fill="#5A716D" font-family="Inter, Arial, sans-serif" font-size="14">admin account, Google, or Apple.</text>

    <rect x="1061" y="748" width="248" height="54" rx="18" fill="#173633"/>
    <text x="1157" y="781" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Log Out</text>

    <rect x="1061" y="813" width="248" height="54" rx="18" fill="#FFFFFF" stroke="#D6E2E0"/>
    <text x="1167" y="846" fill="#173633" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Cancel</text>
  </g>
</svg>
